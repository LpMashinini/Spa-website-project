services:
  spa-frontend:
    image: lebogangmashinini9611/spa-website-project-frontend:latest
    container_name: spa-frontend
    ports:
      - "80:80"
    depends_on:
      - spa-backend
    restart: unless-stopped
    networks:
      - spa-network

  spa-backend:
    image: lebogangmashinini9611/spa-website-project:latest
    container_name: spa-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://spa-database-mysql:3306/spa"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}

      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      spa-database-mysql:
        condition: service_healthy

    restart: unless-stopped
    
    networks:
      - spa-network


  spa-database-mysql:
    image: mysql:8.0
    container_name: spa-database-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spa
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - spa-network


networks:
  spa-network:
    driver: bridge

volumes:
  mysql_data: