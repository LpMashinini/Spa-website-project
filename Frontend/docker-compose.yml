services:
  spa-frontend:
    image: lebogangmashinini9611/spa-website-project-frontend:latest
    container_name: spa-frontend
    ports:
      - "80:80"
    depends_on:
      - spa-backend
    restart: unless-stopped
    networks:
      - spa-network

  spa-backend:
    image: lebogangmashinini9611/spa-website-project:latest
    container_name: spa-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://spa-database-mysql:3306/spa"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - spa-database-mysql
    restart: unless-stopped
    networks:
      - spa-network


  spa-database-mysql:
    image: mysql:8.0
    container_name: spa-database-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spa
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - spa-network


networks:
  spa-network:
    driver: bridge

volumes:
  mysql_data: