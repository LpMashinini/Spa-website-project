services:

  spa-frontend:
    image: lebogangmashinini9611/spa-website-project-frontend:latest
    container_name: spa-frontend
    ports:
      - "80:80"
    depends_on:
      spa-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spa-network

  spa-backend:
    image: lebogangmashinini9611/spa-website-project:latest
    container_name: spa-Backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://spa-database-mysql:3306/spa?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      spa-database-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spa-network

  spa-database-mysql:
    image: mysql:8.0
    container_name: spa-database-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - spa-network

networks:
  spa-networks:
    driver: bridge

volumes:
  mysql_data:
