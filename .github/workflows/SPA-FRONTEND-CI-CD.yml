
name: SPA Frontend CI/CD

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

permissions:
    contents: read

concurrency:
    group: spa-frontend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
      name: Test and Build Frontend
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: npm
            cache-dependency-path: Frontend/package-lock.json

        - name: Install dependencies
          working-directory: Frontend
          run: npm ci

        - name: Run tests
          working-directory: Frontend
          run: npm test -- --run

        - name: Build SPA
          working-directory: Frontend
          run: npm run build

    docker:
      name: Build and Push Frontend Image
      runs-on: ubuntu-latest
      needs: build

      # Never publish images from pull requests.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push frontend image
          uses: docker/build-push-action@v6
          with:
            context: ./Frontend
            file: ./Frontend/Dockerfile
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/spa-website-project-frontend:${{ github.sha }}
              ${{ secrets.DOCKER_USERNAME }}/spa-website-project-frontend:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max